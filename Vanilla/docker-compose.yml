
version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:latest

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"

      SEED: "${MINECRAFT_WORLD_SEED}"

      MODE: "survival"
      DIFFICULTY: "normal"
      ONLINE_MODE: "TRUE"

      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"

      MAX_PLAYERS: "5"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "5"

      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"

      ENABLE_RCON: "TRUE"
      RCON_PORT: "25575"

      TZ: "America/Sao_Paulo"

    volumes:
      - /opt/minecraft/data:/data

    networks:
      minecraft_net:
        aliases:
          - minecraft

    stop_grace_period: 120s

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.labels.minecraft == true

      resources:
        limits:
          cpus: "2.5"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        order: stop-first

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest

    environment:
      SECRET_KEY: "${PLAYIT_SECRET_KEY}"

    networks:
      - minecraft_net

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.labels.minecraft == true

      restart_policy:
        condition: on-failure

networks:
  minecraft_net:
    driver: overlay
    attachable: true
